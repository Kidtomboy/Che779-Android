name: Build Test APK

# Nhánh test: bản "Che779 Test" tách biệt (gói com.che779.test, thư mục J2ME-TEST).
# Chỉ chạy khi push nhánh test hoặc chạy tay; không dùng tag v*, không đụng release chính.
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDevDebug "-PcloneId=com.che779.test" "-PcloneName=Che779 Test" "-PcloneDir=J2ME-TEST"
      - name: Publish (pre-release, không phải bản chính)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=(app/build/outputs/apk/dev/debug/*.apk)
          test -f "${APK[0]}"
          cp "${APK[0]}" Che779-Test.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt2 dump badging Che779-Test.apk | grep -E "^package|application-label:" | tee badging.txt
          grep -q "name='com.che779.test'" badging.txt
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build Che779-Test.apk --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Che779 Test (bản thử cô lập)" \
            --notes "Che779 Test: gói com.che779.test, thư mục J2ME-TEST, tách biệt với bản chính. Đầy đủ chức năng Che779."
