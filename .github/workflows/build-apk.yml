name: Build bản dev (tự động)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-dev-build
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests and build main + clone APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest assembleDevDebug --stacktrace 2>&1 | tee build.log
          # Bản chính xong thì cất APK, rồi build luôn bản clone từ cùng commit (clone luôn đi theo bản chính)
          shopt -s nullglob
          MAIN=(app/build/outputs/apk/dev/debug/*.apk)
          [[ ${#MAIN[@]} -eq 1 ]] || { echo "::error::Expected exactly one main dev APK, found ${#MAIN[@]}."; exit 1; }
          mkdir -p dist
          cp "${MAIN[0]}" dist/Che779-Android.apk
          rm -rf app/build/outputs
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulator2" "-PcloneName=Che779 Emulator 2" "-PcloneDir=J2ME-Che779Clone" --stacktrace 2>&1 | tee -a build.log
          CLONE=(app/build/outputs/apk/dev/debug/*.apk)
          [[ ${#CLONE[@]} -eq 1 ]] || { echo "::error::Expected exactly one clone dev APK, found ${#CLONE[@]}."; exit 1; }
          cp "${CLONE[0]}" dist/Che779-Android-Clone.apk

      - name: Prepare build log
        if: always()
        run: |
          set -euo pipefail
          if [[ -s build.log ]]; then
            {
              echo "Commit: $GITHUB_SHA"
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              sed -n '/What went wrong/,/Try:/p' build.log | head -80 || true
              echo "==== ERRORS"
              grep -nE "error:|\\.java:[0-9]+: |Caused by|Execution failed|ndk-build|clang" build.log | grep -v "at org.gradle" | head -150 || true
              echo "==== TAIL"
              tail -n 10000 build.log
            } > build-tail.log
          else
            {
              echo "Gradle log was not created."
              echo "Commit: $GITHUB_SHA"
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "Build step conclusion: failure or did not start."
            } > build-tail.log
          fi

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build-tail.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log Release without deleting tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Nhật ký build"
          NOTES="Nhật ký build gần nhất. Commit: $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view buildlog >/dev/null 2>&1; then
            gh release edit buildlog --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create buildlog --prerelease --latest=false --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload buildlog build-tail.log --clobber
          mkdir -p verify
          gh release download buildlog --pattern build-tail.log --dir verify
          cmp build-tail.log verify/build-tail.log

      - name: Create checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum Che779-Android.apk Che779-Android-Clone.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Che779-Android-APK
          path: dist/*
          if-no-files-found: error
