name: Khôi phục APK V2 vào dev-2.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout đúng mã nguồn đã tạo APK V2 trước đó
        uses: actions/checkout@v4
        with:
          ref: 36b28699868c2e37d9a2a657b328c11134f835c3
          fetch-depth: 0

      - name: Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Chấp nhận Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build V2 từ source commit 36b2869
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulatorv2" "-PcloneName=Che779 Emulator V2" "-PcloneDir=J2ME-Che779v2"
          APK=(app/build/outputs/apk/dev/debug/*.apk)
          test -f "${APK[0]}"
          mkdir -p out
          cp "${APK[0]}" out/Che779-AndroidV2-2.0.0.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging out/Che779-AndroidV2-2.0.0.apk | tee out/badging.txt
          grep -q "name='com.che779.emulatorv2'" out/badging.txt
          grep -q "versionName='2.0.0-dev-102'" out/badging.txt
          (cd out && sha256sum Che779-AndroidV2-2.0.0.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - name: Đưa APK và SHA256SUMS vào Release dev-2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view dev-2.0.0 >/dev/null
          gh release upload dev-2.0.0 out/Che779-AndroidV2-2.0.0.apk out/SHA256SUMS.txt --clobber
          mkdir -p verify
          gh release download dev-2.0.0 --pattern 'Che779-AndroidV2-2.0.0.apk' --dir verify
          gh release download dev-2.0.0 --pattern 'SHA256SUMS.txt' --dir verify
          cmp out/Che779-AndroidV2-2.0.0.apk verify/Che779-AndroidV2-2.0.0.apk
          cmp out/SHA256SUMS.txt verify/SHA256SUMS.txt
          echo "Verified: assets match the build from source commit 36b2869."

      - name: Dọn Release build-v2 nếu còn tồn tại
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view build-v2 >/dev/null 2>&1; then
            gh release delete build-v2 --yes
          fi
          echo "Release build-v2 đã được dọn nếu tồn tại; giữ nguyên Git tag build-v2 và dev-2.0.0.";
