name: Phát hành

# Gắn thẻ dạng v1.2.0 (hoặc bấm chạy tay) để tự build APK và đưa vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Chấp nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Kiểm thử và build APK
        run: |
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest assembleDevDebug --stacktrace
      - name: Đặt tên file và tạo SHA256SUMS (làm SAU CÙNG, trên đúng file sẽ phát hành)
        run: |
          VER=$(cat VERSION)
          mkdir -p out
          cp app/build/outputs/apk/dev/debug/*.apk "out/Che779-Android-$VER.apk"
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Che779 Android ${{ github.ref_name }}
            Tải file `.apk`, cho phép cài từ nguồn ngoài Play Store rồi cài đặt. Cần Android 5.0 trở lên.
            APK được ký bằng khóa thử nghiệm công khai của dự án để các bản cài đè lên nhau được; đây không phải khóa phát hành riêng.
            Kiểm tra file tải về bằng `SHA256SUMS.txt`. Chi tiết: xem `CHANGELOG.md`.
