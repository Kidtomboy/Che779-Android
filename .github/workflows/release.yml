name: Phát hành bản chính (v*)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      update_tag:
        description: 'Tag Release đã tồn tại cần cập nhật (ví dụ v1.3.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      update: ${{ steps.target.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate target tag and resolve immutable source commit
        id: target
        env:
          INPUT_TAG: ${{ inputs.update_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "::error::update_tag must match vX.Y.Z."; exit 1; }
            gh release view "$TAG" >/dev/null || { echo "::error::Target Release does not exist."; exit 1; }
            UPDATE=true
          else
            [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "::error::Push trigger must be a vX.Y.Z tag."; exit 1; }
            TAG="$REF_NAME"
            UPDATE=false
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          SOURCE_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"   # luôn build đúng commit của tag; workflow không dời tag
          [[ -n "$SOURCE_SHA" ]] || { echo "::error::Cannot resolve source tag."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "update=$UPDATE" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact release tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate version metadata
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" ]] || { echo "::error::VERSION=$ACTUAL_VERSION does not match tag version $EXPECTED_VERSION."; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "::error::Checkout does not match immutable tag commit."; exit 1; }

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test and build main APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest assembleDevDebug --stacktrace

      - name: Build main and clone APK assets
        env:
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          MAIN_APKS=(app/build/outputs/apk/dev/debug/*.apk)
          [[ ${#MAIN_APKS[@]} -eq 1 ]] || { echo "::error::Expected exactly one main APK."; exit 1; }
          mkdir -p out
          cp "${MAIN_APKS[0]}" "out/Che779-Android-$VER.apk"
          rm -rf app/build/outputs
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulator2" "-PcloneName=Che779 Emulator 2" "-PcloneDir=J2ME-Che779Clone" --stacktrace
          CLONE_APKS=(app/build/outputs/apk/dev/debug/*.apk)
          [[ ${#CLONE_APKS[@]} -eq 1 ]] || { echo "::error::Expected exactly one clone APK."; exit 1; }
          cp "${CLONE_APKS[0]}" "out/Che779-Android-Clone-$VER.apk"

      - name: Build Termux V2 and test V1 experimental script
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-emulator.sh v2
          bash tests/test-termux.sh build/Che779_EmulatorV2.jar
          bash termux/build-termux.sh build/Che779_EmulatorV2.jar Che779_EmulatorV2.jar out/che779-termux.sh
          bash .github/scripts/fetch-emulator.sh v1
          mkdir -p test-out
          bash termux/build-termux.sh build/Che779_Emulator.jar Che779_Emulator.jar test-out/che779-termux-v1-test.sh

      - name: Create final checksums and release notes
        env:
          VER: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          (cd out && sha256sum "Che779-Android-$VER.apk" "Che779-Android-Clone-$VER.apk" che779-termux.sh > SHA256SUMS.txt)
          sed "s/@TAG@/$TAG/g; s/@VER@/$VER/g" .github/release-notes.md > out-notes.md
          cat out/SHA256SUMS.txt
          {
            echo "### Release source"
            echo "- Tag: $TAG"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Version: $VER"
            echo
            echo "### Assets"
            while read -r SUM FILE; do
              echo "- $FILE — $SUM — $(stat -c%s "out/$FILE") bytes"
            done < out/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: termux-v1-test
          path: test-out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.resolve.outputs.tag }}
          path: out/*
          if-no-files-found: error

      - name: Create new tagged Release
        if: needs.resolve.outputs.update == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.source_sha }}
          files: |
            out/*
          name: ${{ needs.resolve.outputs.tag }}
          prerelease: false
          make_latest: true
          body_path: out-notes.md

      - name: Update existing Release assets safely
        if: needs.resolve.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" out/*.apk out/che779-termux.sh --clobber
          gh release upload "$TAG" out/SHA256SUMS.txt --clobber
          mkdir -p verify
          gh release download "$TAG" --pattern '*.apk' --dir verify
          gh release download "$TAG" --pattern 'che779-termux.sh' --dir verify
          gh release download "$TAG" --pattern 'SHA256SUMS.txt' --dir verify
          (cd verify && sha256sum -c SHA256SUMS.txt)
          cmp out/SHA256SUMS.txt verify/SHA256SUMS.txt
          gh release edit "$TAG" --title "$TAG" --prerelease=false --latest --notes-file out-notes.md
          {
            echo "Release $TAG assets uploaded and verified."
            echo "Source commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
