name: Phát hành

# Gắn thẻ dạng v1.3.0 (hoặc bấm chạy tay) để tự build APK và đưa vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      update_tag:
        description: 'Cập nhật tệp của bản phát hành đã có (ví dụ v1.3.0), giữ nguyên số phiên bản'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Chấp nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Kiểm thử và build APK
        run: |
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest assembleDevDebug --stacktrace
      - name: Build bản clone (gói com.che779.emulatorv2, thư mục dữ liệu J2ME-Che779v2)
        run: |
          mkdir -p out
          VER=$(cat VERSION)
          cp app/build/outputs/apk/dev/debug/*.apk "out/Che779-Android-$VER.apk"
          rm -rf app/build/outputs
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulatorv2" "-PcloneName=Che779 Emulator 2" "-PcloneDir=J2ME-Che779v2" --stacktrace
          cp app/build/outputs/apk/dev/debug/*.apk "out/Che779-Android-Clone-$VER.apk"
      - name: Lấy mã V2 đúng commit ghim, build jar và ghép script Termux (V2)
        run: |
          bash .github/scripts/fetch-emulator.sh v2
          bash tests/test-termux.sh build/Che779_EmulatorV2.jar
          bash termux/build-termux.sh build/Che779_EmulatorV2.jar Che779_EmulatorV2.jar out/che779-termux.sh
      - name: Ghép script Termux V1 thử nghiệm (chỉ đưa vào artifact, không vào Releases)
        run: |
          bash .github/scripts/fetch-emulator.sh v1
          mkdir -p test-out
          bash termux/build-termux.sh build/Che779_Emulator.jar Che779_Emulator.jar test-out/che779-termux-v1-test.sh
      - name: Tạo SHA256SUMS (làm SAU CÙNG, trên đúng file sẽ phát hành)
        run: |
          cd out
          sha256sum *.apk che779-termux.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Ghi chú phát hành (từ .github/release-notes.md)
        run: |
          VER=$(cat VERSION)
          TAG="${{ inputs.update_tag != '' && inputs.update_tag || github.ref_name }}"
          sed "s/@TAG@/$TAG/g; s/@VER@/$VER/g" .github/release-notes.md > out-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: termux-v1-test
          path: test-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: out-notes.md
      - name: Cập nhật bản phát hành đã có (giữ nguyên thẻ và số phiên bản)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.update_tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          # tệp dữ liệu trước, SHA256SUMS.txt đưa lên SAU CÙNG
          gh release upload "$TAG" out/*.apk out/che779-termux.sh --clobber
          gh release upload "$TAG" out/SHA256SUMS.txt --clobber
          # sửa tên/ghi chú và gỡ tệp nhật ký build lạc vào bản phát hành (nhật ký build có bản riêng, thẻ buildlog)
          gh release edit "$TAG" --title "$TAG" --prerelease=false --latest --notes-file out-notes.md
          gh release delete-asset "$TAG" build-tail.log --yes || true
