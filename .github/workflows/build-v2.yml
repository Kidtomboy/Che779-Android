name: Build V2 APK

# Nhánh build-v2: bản "Che779 Emulator V2" (gói com.che779.emulatorv2, thư mục J2ME-Che779v2).
# Chỉ chạy khi push nhánh test hoặc chạy tay; không dùng tag v*, không đụng release chính.
on:
  push:
    branches: [build-v2]
    tags: ['dev-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Đăng APK vào tag này (vd. dev-2.0.0); để trống = pre-release build-v2'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulatorv2" "-PcloneName=Che779 Emulator V2" "-PcloneDir=J2ME-Che779v2"
      - name: Đăng bản V2 + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK=(app/build/outputs/apk/dev/debug/*.apk)
          test -f "${APK[0]}"
          cp "${APK[0]}" Che779-Emulator-V2.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt2 dump badging Che779-Emulator-V2.apk | grep -E "^package|application-label:" | tee badging.txt
          grep -q "name='com.che779.emulatorv2'" badging.txt
          sha256sum Che779-Emulator-V2.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          NOTES="Che779 Emulator dev-v2.0.0 (bản thử): gói com.che779.emulatorv2, thư mục J2ME-Che779v2. Tách biệt với bản chính v1.3.1. Kiểm tra: sha256sum -c SHA256SUMS.txt"
          if [ -n "$TAG" ]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false \
              --title "Che779 Emulator dev-v2.0.0" --notes "$NOTES"
            gh release upload "$TAG" Che779-Emulator-V2.apk --clobber
            gh release upload "$TAG" SHA256SUMS.txt --clobber
          else
            gh release delete build-v2 --yes --cleanup-tag || true
            gh release create build-v2 Che779-Emulator-V2.apk --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Che779 Emulator dev-v2.0.0 (bản dựng mới nhất)" --notes "$NOTES"
            gh release upload build-v2 SHA256SUMS.txt --clobber
          fi
