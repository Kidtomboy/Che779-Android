name: Build V2 APK

# Nhánh build-v2: bản "Che779 Emulator V2" (gói com.che779.emulatorv2, thư mục J2ME-Che779v2).
# Chạy khi push nhánh build-v2, push tag dev-*, hoặc chạy tay; không dùng tag v*, không đụng release chính.
on:
  push:
    branches: [build-v2]
    tags: ['dev-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Đăng APK vào tag này (vd. dev-2.0.0); để trống = pre-release build-v2'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDevDebug "-PcloneId=com.che779.emulatorv2" "-PcloneName=Che779 Emulator V2" "-PcloneDir=J2ME-Che779v2"
      - name: Đăng bản V2 + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK=(app/build/outputs/apk/dev/debug/*.apk)
          test -f "${APK[0]}"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt2 dump badging "${APK[0]}" | grep -E "^package|application-label:" | tee badging.txt
          grep -q "name='com.che779.emulatorv2'" badging.txt
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          VER="${TAG#dev-}"
          [ -n "$VER" ] || VER="2.0.0"
          mkdir -p out
          NAME="Che779-AndroidV2-${VER}.apk"
          cp "${APK[0]}" "out/$NAME"
          (cd out && sha256sum "$NAME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s/@TAG@/${TAG:-dev-$VER}/g; s/@VER@/$VER/g" .github/release-notes-v2.md > out-notes.md
          if [ -n "$TAG" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --prerelease --latest=false --title "Che779 Android V2 $TAG" --notes-file out-notes.md
            else
              gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
                --title "Che779 Android V2 $TAG" --notes-file out-notes.md
            fi
            gh release upload "$TAG" "out/$NAME" --clobber
            gh release upload "$TAG" out/SHA256SUMS.txt --clobber
            gh release delete build-v2 --yes --cleanup-tag || true
          else
            gh release delete build-v2 --yes --cleanup-tag || true
            gh release create build-v2 "out/$NAME" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Che779 Android V2 (bản dựng mới nhất)" --notes-file out-notes.md
            gh release upload build-v2 out/SHA256SUMS.txt --clobber
          fi
