plugins {
    id 'com.android.application'
}

def midletArchivesBaseName

def cloneId = project.findProperty("cloneId") ?: "com.che779.emulator"
def cloneName = project.findProperty("cloneName") ?: rootProject.name
def cloneDir = project.findProperty("cloneDir") ?: "J2ME-Che779"
if (!(cloneId ==~ /[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+/)) {
    throw new GradleException("cloneId must be a valid dotted Android application ID")
}
if (!(cloneName.toString() ==~ /[A-Za-z0-9][A-Za-z0-9 ._()\-]{0,39}/)) {
    throw new GradleException("cloneName must be 1-40 safe ASCII letters, digits, spaces or ._()- characters")
}
if (!(cloneDir ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,63}/) || cloneDir.contains("..")) {
    throw new GradleException("cloneDir must be a safe folder name (1-64 letters, digits, dot, underscore or dash)")
}

def releaseStoreFile = System.getenv("CHE779_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("CHE779_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("CHE779_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CHE779_RELEASE_KEY_PASSWORD")
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
if (releaseSigningValues.any { it } && !releaseSigningValues.every { it }) {
    throw new GradleException("Set all CHE779_RELEASE_STORE_FILE/PASSWORD/KEY_ALIAS/KEY_PASSWORD values to sign release builds")
}

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        applicationId cloneId
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 103
        versionName "0.0.0.2-android"
        resValue 'string', 'app_name', cloneName
        buildConfigField 'String', 'DATA_DIR_NAME', '"' + cloneDir + '"'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        che779test {
            // Public test key: intentionally limited to dev/debug builds so users can update test APKs.
            storeFile file('che779-test.keystore')
            storePassword 'che779test'
            keyAlias 'che779'
            keyPassword 'che779test'
        }
        if (releaseStoreFile) {
            releasePrivate {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Never sign a production release with the repository's public test key.
            if (releaseStoreFile) {
                signingConfig signingConfigs.releasePrivate
            }
        }
        debug {
            signingConfig signingConfigs.che779test
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions 'default'
    productFlavors {
        play {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-play"
        }
        open {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-open"
        }
        fdroid {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        dev {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-dev-" + generateVersionCode()
        }
        // variant dimension for create android port from J2ME app source
        midlet {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'false'
            // configure midlet's port project params here, as default it read from app manifest,
            // placed to 'app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF'
            def props = getMidletManifestProperties()
            def midletName = props.getValue('MIDlet-Name').trim()
            def apkName = midletName.replaceAll('[/\\\\:*?\"<>|]', '').replace(' ', '_')
            applicationId "com.example.androidlet.${apkName.toLowerCase()}"
            versionName = props.getValue('MIDlet-Version')
            resValue 'string', 'app_name', midletName
            midletArchivesBaseName = apkName
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-midlet.pro', 'proguard-common.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    applicationVariants.all {
        if (buildType.name == 'debug' && flavorName != 'midlet' && !project.hasProperty('cloneName')) {
            resValue 'string', 'app_name', 'Che779 Emulator'
        }
        def baseName = flavorName == 'midlet' ? "${midletArchivesBaseName}-" : "${rootProject.name}-"
        outputs.all {
            outputFileName = "${baseName}${versionName}-${dirName}-${buildType.name}.apk"
                    .replaceAll('--+', '-').replaceAll(' +', '_')
        }
    }

    buildFeatures {
        viewBinding true
    }
}

static def generateVersionCode() {
    try {
        def process = new ProcessBuilder("git", "rev-list", "HEAD", "--count")
                .redirectErrorStream(true).start()
        def result = process.inputStream.getText("UTF-8").trim()
        if (process.waitFor() == 0 && result ==~ /\d+/) {
            return Math.max(1, result.toInteger())
        }
    } catch (Exception ignored) {
        // Source archives may not include the .git directory.
    }
    def runNumber = System.getenv("GITHUB_RUN_NUMBER")
    return runNumber != null && runNumber ==~ /\d+/ ? Math.max(1, runNumber.toInteger()) : 1
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()
    if (file.exists()) {
        def is = null
        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) is.close()
        }
    }
    return mf.mainAttributes
}

dependencies {
    def roomVersion = '2.5.2'
    def cameraxVersion = "1.3.0-beta01"
    def autoServiceVersion = "1.0"

    implementation project(':dexlib')

    // Android Jetpack
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Networking && APIs
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.guava:guava:31.0.1-android'

    // Threads, Streams and Archives
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.10.0'

    // Audio/Video/Graphics
    implementation 'com.github.billthefarmer:mididriver:v1.21'
    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'com.github.nikita36078:mobile-ffmpeg:v4.3.2-compact'

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Android UI
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // Testing && CrashReports
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'junit:junit:4.13.2'
    implementation 'ch.acra:acra-dialog:5.9.3'

    // Other Libraries
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    compileOnly "com.google.auto.service:auto-service-annotations:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}
